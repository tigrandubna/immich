name: standalone-build

# Builds the three custom images the standalone desktop app needs and publishes
# them multi-arch (amd64 + arm64) to GHCR under this fork's namespace.
#
#   ghcr.io/tigrandubna/immich-server
#   ghcr.io/tigrandubna/immich-machine-learning
#   ghcr.io/tigrandubna/immich-postgres-ru
#
# Trigger manually (workflow_dispatch) for a `dev` tag, or push a
# `standalone-vX.Y.Z` git tag to publish a versioned release + `latest`.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish'
        default: dev
  push:
    tags:
      - 'standalone-v*'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: tigrandubna

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      push_latest: ${{ steps.v.outputs.push_latest }}
    steps:
      - id: v
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/standalone-v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/standalone-v}" >> "$GITHUB_OUTPUT"
            echo "push_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.tag || 'dev' }}" >> "$GITHUB_OUTPUT"
            echo "push_latest=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: immich-server
            context: .
            file: server/Dockerfile
            build-args: ''
          - name: immich-machine-learning
            context: machine-learning
            file: machine-learning/Dockerfile
            build-args: |
              DEVICE=cpu
          - name: immich-postgres-ru
            context: docker
            file: docker/Dockerfile.postgres-ru
            build-args: ''
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          platforms: linux/${{ matrix.platform.arch }}
          # BUILD_ID pins SvelteKit's kit.version.name (web/svelte.config.js).
          # Without it the web build falls back to Date.now(), which is evaluated
          # separately for the client chunks and the adapter-static index.html,
          # producing mismatched __sveltekit_<hash> globals -> the app hangs on
          # the loading screen. A fixed value keeps them in sync. (Harmless for
          # the ML and postgres images, whose Dockerfiles ignore it.)
          build-args: |
            ${{ matrix.image.build-args }}
            BUILD_ID=${{ needs.prepare.outputs.version }}
          provenance: false
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - immich-server
          - immich-machine-learning
          - immich-postgres-ru
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          IMAGE="${REGISTRY}/${OWNER}/${{ matrix.image }}"
          TAGS="-t ${IMAGE}:${{ needs.prepare.outputs.version }}"
          if [[ "${{ needs.prepare.outputs.push_latest }}" == "true" ]]; then
            TAGS="${TAGS} -t ${IMAGE}:latest"
          fi
          docker buildx imagetools create ${TAGS} \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect
        run: |
          docker buildx imagetools inspect \
            "${REGISTRY}/${OWNER}/${{ matrix.image }}:${{ needs.prepare.outputs.version }}"
